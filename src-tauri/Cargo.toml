[package]
name = "wi-retro"
version = "0.1.0"
description = "Gestor de emulación de alto rendimiento — MVP GBA"
authors = ["wydex"]
edition = "2021"

[lib]
name = "wi_retro_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rayon = "1"
blake3 = "1"
parking_lot = "0.12"
thiserror = "2"
tokio = { version = "1", features = ["time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
